name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup (clean clone → working app)
        run: make setup
      - name: Check (lint, types, tests)
        run: make check
      - name: Logs on failure
        if: failure()
        run: docker compose logs
